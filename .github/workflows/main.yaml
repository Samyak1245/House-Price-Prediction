```yaml
name: Flask ML App CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Upgrade pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Check Python syntax
      - name: Check Python syntax
        run: |
          python -m py_compile app.py

      # Check that the ML model and scaler can be loaded
      - name: Test model loading
        run: |
          python -c "import pickle; pickle.load(open('regmodel.pkl', 'rb')); pickle.load(open('scaling.pkl', 'rb')); print('Model and scaler loaded successfully')"

      # Test Flask application
      - name: Test Flask app
        run: |
          python -c "from app import app; print('Flask application loaded successfully')"
```
