<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>California House Price Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .prediction {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>California House Price Prediction</h1>

    <form action="/predict" method="POST">

        <div class="form-group">
            <label for="MedInc">Median Income</label>
            <input
                type="number"
                id="MedInc"
                name="MedInc"
                step="any"
                placeholder="Example: 8.3252"
                required>
        </div>

        <div class="form-group">
            <label for="HouseAge">House Age</label>
            <input
                type="number"
                id="HouseAge"
                name="HouseAge"
                step="any"
                placeholder="Example: 41"
                required>
        </div>

        <div class="form-group">
            <label for="AveRooms">Average Rooms</label>
            <input
                type="number"
                id="AveRooms"
                name="AveRooms"
                step="any"
                placeholder="Example: 6.984127"
                required>
        </div>

        <div class="form-group">
            <label for="AveBedrms">Average Bedrooms</label>
            <input
                type="number"
                id="AveBedrms"
                name="AveBedrms"
                step="any"
                placeholder="Example: 1.02381"
                required>
        </div>

        <div class="form-group">
            <label for="Population">Population</label>
            <input
                type="number"
                id="Population"
                name="Population"
                step="any"
                placeholder="Example: 322"
                required>
        </div>

        <div class="form-group">
            <label for="AveOccup">Average Occupancy</label>
            <input
                type="number"
                id="AveOccup"
                name="AveOccup"
                step="any"
                placeholder="Example: 2.555556"
                required>
        </div>

        <div class="form-group">
            <label for="Latitude">Latitude</label>
            <input
                type="number"
                id="Latitude"
                name="Latitude"
                step="any"
                placeholder="Example: 37.88"
                required>
        </div>

        <div class="form-group">
            <label for="Longitude">Longitude</label>
            <input
                type="number"
                id="Longitude"
                name="Longitude"
                step="any"
                placeholder="Example: -122.23"
                required>
        </div>

        <button type="submit">
            Predict House Price
        </button>

    </form>


    {% if prediction_text %}

    <div class="prediction">
        {{ prediction_text }}
    </div>

    {% endif %}

</div>

</body>

</html>
